version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: saferoute_postgis
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: saferoute
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d saferoute"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    name: saferoute_postgis_data
